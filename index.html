<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니어처 최저가</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1c1b19; --muted: #6b6860; --line: #e4e1da;
    --accent: #b4441c; --ok: #2f7d4f; --bad: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --card: #1f1e1b; --text: #eeebe4; --muted: #9c978c; --line: #33312c; --accent: #f07a4a; --ok: #5cc184; --bad: #e77; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  button { padding: 0 18px; font-size: 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 10px; font-size: 13px; }
  #shops { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { white-space: nowrap; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  label.toggle { margin-left: auto; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li a { display: flex; gap: 12px; padding: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
  li a:hover { border-color: var(--accent); }
  li.best a { border: 2px solid var(--accent); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .price { text-align: right; flex: none; }
  .price b { font-size: 17px; }
  .price s { display: block; color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: 2px; }
  .tag.best { background: var(--accent); color: #fff; }
  .tag.out { background: var(--line); color: var(--muted); }
  .soldout { opacity: .55; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>미니어처 최저가</h1>
  <p class="sub">국내 미니어처 게임 쇼핑몰 가격을 한 번에 비교합니다.</p>

  <form id="f">
    <input type="search" id="q" placeholder="예: intercessor, combat patrol" autocomplete="off" required minlength="2" maxlength="60">
    <button id="btn">검색</button>
  </form>
  <p class="hint">대부분 쇼핑몰이 영어 상품명을 써서, 영어로 검색하면 더 많이 나옵니다.</p>

  <div class="bar" id="bar" hidden>
    <span id="shops"></span>
    <label class="toggle"><input type="checkbox" id="hideOut" checked> 품절 숨기기</label>
  </div>
  <ul id="list"></ul>

  <footer>가격은 각 쇼핑몰 검색 결과 기준이며 실제 가격과 다를 수 있습니다. 구매 전 쇼핑몰에서 확인하세요.</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let last = null;

function render() {
  if (!last) return;
  const hide = $('hideOut').checked;
  const items = last.items.filter((it) => !(hide && (it.soldOut || !it.price)));
  $('shops').innerHTML = last.status
    .map((s) => `<span class="chip ${s.ok ? '' : 'bad'}">${esc(s.shop)} ${s.ok ? s.count : '연결 실패'}</span>`)
    .join(' ');
  $('bar').hidden = false;
  if (!items.length) {
    $('list').innerHTML = `<li class="empty">검색 결과가 없습니다.${hide ? ' (품절 숨기기를 꺼 보세요)' : ''}</li>`;
    return;
  }
  const bestIdx = items.findIndex((it) => it.price && !it.soldOut);
  $('list').innerHTML = items
    .map((it, i) => `
      <li class="${i === bestIdx ? 'best' : ''} ${it.soldOut ? 'soldout' : ''}">
        <a href="${esc(it.url)}" target="_blank" rel="noopener">
          <div class="info">
            <div class="name">${esc(it.name)}${i === bestIdx ? '<span class="tag best">최저가</span>' : ''}${it.soldOut ? '<span class="tag out">품절</span>' : ''}</div>
            ${it.subtitle ? `<div class="meta">${esc(it.subtitle)}</div>` : ''}
            <div class="meta">${esc(it.shop)}</div>
          </div>
          <div class="price">
            ${it.price ? `<b>${won(it.price)}</b>` : `<span class="meta">${esc(it.priceNote)}</span>`}
            ${it.listPrice ? `<s>${won(it.listPrice)}</s>` : ''}
          </div>
        </a>
      </li>`)
    .join('');
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('q').value.trim();
  $('btn').disabled = true;
  $('btn').textContent = '검색 중…';
  $('list').innerHTML = '<li class="empty">쇼핑몰에서 가격을 가져오는 중입니다…</li>';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '오류');
    last = data;
    render();
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  } catch (err) {
    $('list').innerHTML = `<li class="empty">검색에 실패했습니다: ${esc(err.message)}</li>`;
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '검색';
  }
});
$('hideOut').addEventListener('change', render);

const initial = new URLSearchParams(location.search).get('q');
if (initial) { $('q').value = initial; $('f').requestSubmit(); }
</script>
</body>
</html>
