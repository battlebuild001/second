<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니어처 최저가</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1c1b19; --muted: #6b6860; --line: #e4e1da;
    --accent: #b4441c; --ok: #2f7d4f; --bad: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --card: #1f1e1b; --text: #eeebe4; --muted: #9c978c; --line: #33312c; --accent: #f07a4a; --ok: #5cc184; --bad: #e77; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  button { padding: 0 18px; font-size: 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 10px; font-size: 13px; }
  #shops { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { white-space: nowrap; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  label.toggle { margin-left: auto; color: var(--muted); display: flex; gap: 4px; align-items: center; }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  #list { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .head { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .lowest { text-align: right; flex: none; }
  .lowest b { font-size: 18px; color: var(--accent); }
  .offers li + li { border-top: 1px solid var(--line); }
  .offers a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; color: inherit; text-decoration: none; }
  .offers a:hover { background: var(--bg); }
  .offers .best a { font-weight: 700; color: var(--accent); }
  .offers .p { text-align: right; white-space: nowrap; }
  .offers s { color: var(--muted); font-size: 12px; font-weight: 400; margin-right: 6px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; background: var(--line); color: var(--muted); font-weight: 400; }
  .soldout { opacity: .55; }
  .extra { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .extra.coupon { color: var(--ok); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>미니어처 최저가</h1>
  <p class="sub">국내 미니어처 게임 쇼핑몰 가격을 한 번에 비교합니다. · <a href="/army.html" style="color:var(--accent)">군대 최저가 장바구니 →</a></p>

  <form id="f">
    <input type="search" id="q" placeholder="예: intercessor, combat patrol" autocomplete="off" required minlength="2" maxlength="60">
    <button id="btn">검색</button>
  </form>
  <p class="hint">대부분 쇼핑몰이 영어 상품명을 써서, 영어로 검색하면 더 많이 나옵니다.</p>

  <div class="bar" id="bar" hidden>
    <span id="shops"></span>
    <label class="toggle"><input type="checkbox" id="hideOut" checked> 품절 숨기기</label>
  </div>
  <ul id="list"></ul>

  <footer>가격은 각 쇼핑몰 검색 결과 기준이며 실제 가격과 다를 수 있습니다. 쿠폰·적립금은 회원가입·구매 조건이 있을 수 있으니 구매 전 쇼핑몰에서 확인하세요.</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const won = (n) => n.toLocaleString('ko-KR') + '원';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let last = null;

function render() {
  if (!last) return;
  const hide = $('hideOut').checked;
  $('shops').innerHTML = last.status
    .map((s) => `<span class="chip ${s.ok ? '' : 'bad'}">${esc(s.shop)} ${s.ok ? s.count : '연결 실패'}</span>`)
    .join(' ');
  $('bar').hidden = false;
  const benefits = Object.fromEntries(last.status.map((s) => [s.shopId, s.benefits || []]));
  const groups = last.groups
    .map((g) => ({ ...g, offers: g.offers.filter((o) => !(hide && (o.soldOut || !o.price))) }))
    .filter((g) => g.offers.length);
  if (!groups.length) {
    $('list').innerHTML = `<li class="empty">검색 결과가 없습니다.${hide ? ' (품절 숨기기를 꺼 보세요)' : ''}</li>`;
    return;
  }
  $('list').innerHTML = groups
    .map((g) => `
      <li class="card">
        <div class="head">
          <div class="info">
            <div class="name">${esc(g.name)}</div>
            ${g.subtitle ? `<div class="meta">${esc(g.subtitle)}</div>` : ''}
          </div>
          <div class="lowest">${g.lowest ? `<span class="meta">최저</span> <b>${won(g.lowest)}</b>` : '<span class="meta">구매 가능 없음</span>'}<div class="meta">${g.offers.length}곳</div></div>
        </div>
        <ol class="offers">
          ${g.offers.map((o) => `
            <li class="${o.soldOut || !o.price ? 'soldout' : ''} ${o.price && o.price === g.lowest && !o.soldOut ? 'best' : ''}">
              <a href="${esc(o.url)}" target="_blank" rel="noopener">
                <span class="shop">${esc(o.shop)}${o.soldOut ? '<span class="tag out">품절</span>' : ''}
                  ${o.points ? `<span class="extra">적립 ${won(o.points)}${o.pointsNote ? ` (${esc(o.pointsNote)})` : ''}</span>` : ''}
                  ${(benefits[o.shopId] || []).map((b) => `<span class="extra coupon">🎟 ${esc(b)}</span>`).join('')}
                </span>
                <span class="p">${o.listPrice ? `<s>${won(o.listPrice)}</s>` : ''}${o.price ? won(o.price) : esc(o.priceNote)}</span>
              </a>
            </li>`).join('')}
        </ol>
      </li>`)
    .join('');
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('q').value.trim();
  $('btn').disabled = true;
  $('btn').textContent = '검색 중…';
  $('list').innerHTML = '<li class="empty">쇼핑몰에서 가격을 가져오는 중입니다…</li>';
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '오류');
    last = data;
    render();
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  } catch (err) {
    $('list').innerHTML = `<li class="empty">검색에 실패했습니다: ${esc(err.message)}</li>`;
  } finally {
    $('btn').disabled = false;
    $('btn').textContent = '검색';
  }
});
$('hideOut').addEventListener('change', render);

const initial = new URLSearchParams(location.search).get('q');
if (initial) { $('q').value = initial; $('f').requestSubmit(); }
</script>
</body>
</html>
